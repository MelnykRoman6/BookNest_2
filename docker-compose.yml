services:
  db:
    image: postgres:15
    container_name: booknest-db
    environment:
      POSTGRES_USER: ${BOOKNEST_DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${BOOKNEST_DB_PASSWORD:?set BOOKNEST_DB_PASSWORD}
      POSTGRES_DB: ${BOOKNEST_DB_NAME:-booknest_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
