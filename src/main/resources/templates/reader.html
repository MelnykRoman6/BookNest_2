<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading: [(${book.title})]</title>
    <style>
        body {
            background-color: #0b0c10;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .reader-header {
            background-color: #1f2833;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #45f3ff;
            height: 60px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-back {
            color: #45f3ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-back:hover { color: #ff0055; }

        .book-title {
            margin: 0;
            font-size: 15px;
            color: #fff;
            text-align: center;
            line-height: 1.3;
        }

        .reader-main {
            flex: 1;
            background-color: #090a0f;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .archive-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

<header class="reader-header">
    <a th:href="@{/book/{id}(id=${book.openLibraryId})}" class="btn-back">← LEAVE READER</a>
    <h2 class="book-title">
        <span th:text="${book.title}">Title</span><br>
        <small style="color: #45f3ff;" th:text="${authorName}">Author</small>
    </h2>
    <div style="width: 120px;"></div>
</header>

<main class="reader-main">
    <iframe th:if="${iaId != null and iaId != 'null' and !iaId.empty}"
            th:src="'https://archive.org/embed/' + ${iaId} + '?ui=embed'"
            class="archive-iframe"
            allowfullscreen="true">
    </iframe>

    <div th:unless="${iaId != null and iaId != 'null' and !iaId.empty}" class="error-placeholder">
        [ DIGITAL_SCAN_UNAVAILABLE_FOR_THIS_EDITION ]
    </div>
</main>

</body>
</html>
