<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading: [(${book.title})]</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .reader-header {
            background-color: #1f2833;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #45f3ff;
            height: 60px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-back {
            color: #45f3ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #ff0055;
        }

        .book-title {
            margin: 0;
            font-size: 16px;
            color: #fff;
            text-align: center;
        }

        .reader-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0d0d0d;
            padding: 20px;
            box-sizing: border-box;
        }

        .book-page {
            max-width: 700px;
            width: 100%;
            height: 75vh;
            background-color: #151a21;
            border: 1px solid #1f2833;
            border-radius: 8px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 19px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #e0e0e0;
        }

        .reader-controls {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-nav {
            background: none;
            border: 2px solid #45f3ff;
            color: #45f3ff;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background-color: #45f3ff;
            color: #0b0c10;
            box-shadow: 0 0 15px #45f3ff;
        }

        .btn-nav:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        .page-info {
            color: #a0a0a0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="reader-header">
    <a th:href="@{/book/{id}(id=${book.openLibraryId})}" class="btn-back">← BACK TO DETAILS</a>
    <h2 class="book-title">
        <span th:text="${book.title}">Title</span> <br>
        <small style="color: #45f3ff;" th:text="${authorName}">Author</small>
    </h2>
    <div style="width: 120px;"></div>
</header>

<main class="reader-main">
    <div class="book-page" id="pageContent">Loading book content...</div>

    <div class="reader-controls">
        <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">&lt; PREV</button>
        <span class="page-info" id="pageNumber">Page 1 / 1</span>
        <button class="btn-nav" id="nextBtn" onclick="changePage(1)">NEXT &gt;</button>
    </div>
</main>

<div id="rawText" th:text="${textContent}" style="display: none;"></div>

<script>
    const fullText = document.getElementById('rawText').innerText;

    const pageSize = 1800;
    const pages = [];
    let currentPage = 0;

    function paginateText() {
        if (!fullText || fullText.trim() === "") {
            pages.push("This book has no content yet. Please upload a text file.");
            return;
        }

        let pointer = 0;
        while (pointer < fullText.length) {
            let chunk = fullText.substr(pointer, pageSize);

            if (pointer + pageSize < fullText.length) {
                const lastSpace = chunk.lastIndexOf(" ");
                if (lastSpace > Math.size * 0.5) {
                    chunk = chunk.substring(0, lastSpace);
                }
            }
            pages.push(chunk);
            pointer += chunk.length;
        }
    }

    function renderPage() {
        document.getElementById('pageContent').innerText = pages[currentPage];
        document.getElementById('pageNumber').innerText = `Page ${currentPage + 1} / ${pages.length}`;

        document.getElementById('prevBtn').disabled = (currentPage === 0);
        document.getElementById('nextBtn').disabled = (currentPage === pages.length - 1);

        document.getElementById('pageContent').scrollTop = 0;
    }

    function changePage(direction) {
        currentPage += direction;
        renderPage();
    }

    paginateText();
    renderPage();
</script>

</body>
</html>
