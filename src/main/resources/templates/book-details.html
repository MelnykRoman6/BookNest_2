<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isLocal ? book.title : externalBook.title}">Book Details</title>
    <link rel="stylesheet" th:href="@{/css/book.css}">
</head>
<body>

<div class="user-menu">
    <a th:href="@{/}" class="back-link" style="margin-right: 20px;">← Back to Catalog</a>
    <div th:if="${currentUser != null}">
        <a th:href="@{/profile}" class="btn-menu btn-blue">Profile</a>
        <a th:href="@{/logout}" class="btn-menu btn-red-dark">Logout</a>
    </div>
</div>

<div class="details-wrapper">

    <div class="side-panel">
        <img th:src="${isLocal ? book.coverUrl : externalBook.coverUrl}" class="book-cover" alt="Cover">

        <div class="action-btns" style="margin-top: 15px;">
            <a th:if="${iaId != null}"
               th:href="'https://archive.org/details/' + ${iaId}"
               target="_blank"
               class="btn-action btn-green-reg"
               style="text-align: center; text-decoration: none; margin-bottom: 5px;">
                Read Online (Archive)
            </a>

            <a th:href="@{/book/{id}/read(id=${isLocal ? book.openLibraryId : externalBook.openLibraryId})}"
               class="btn-action btn-cyan"
               style="text-align: center; text-decoration: none;">
                📖 Read Online
            </a>
        </div>

        <div class="collection-form" th:if="${collections != null and !collections.empty}" style="margin-top: 15px;">
            <span class="collection-label">Add to collection:</span>

            <form th:action="@{/collection/add-book}" method="POST" class="select-wrapper">
                <input type="hidden" name="bookId" th:value="${book.id}" />

                <select class="select-dark" name="collectionId" required>
                    <option value="" disabled selected>Choose a collection...</option>
                    <option th:each="col : ${collections}"
                            th:value="${col.id}"
                            th:text="${col.name}">Reading</option>
                </select>
                <input type="hidden" name="olId" th:value="${book.openLibraryId}" />
                <button type="submit" class="btn-save">Save</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <h1 th:text="${isLocal ? book.title : externalBook.title}">Book Title</h1>

        <div class="tags-container">
            <th:block th:if="${isLocal and book != null}">
                <span class="tag" th:each="author : ${book.authors}" th:text="${author.name}">Author</span>
            </th:block>

            <th:block th:if="${not isLocal and externalBook != null}">
                <span class="tag" th:each="subject : ${externalBook['subjects']}" th:text="${subject}">Subject</span>
            </th:block>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <h3>Description</h3>
        <p class="description-text" th:text="${isLocal ? (book.description != null ? book.description : 'No description available in Database.') : (externalBook.description != null ? externalBook.description : 'No description available.')}"></p>

        <div th:if="${isLocal and book != null and !#lists.isEmpty(book.reviews)}" style="margin-top: 40px;">
            <h3>Reviews</h3>
            <div th:each="review : ${book.reviews}" class="review-card">
                <p th:text="${review.comment}">Review text</p>
                <small th:text="'Rating: ' + ${review.rating} + '/5'"></small>
            </div>
        </div>
    </div>

</div>

</body>
</html>
