<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>My Profile - BookNest</title>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

<div class="profile-layout">
    <aside class="profile-sidebar">
        <div class="avatar-placeholder">
            <span th:text="${#strings.substring(user.email, 0, 1).toUpperCase()}">U</span>
        </div>
        <h2 th:text="${user.email}">user@email.com</h2>
        <p class="reg-date">
            Member since: <span th:text="${#temporals.format(user.dateReg, 'dd MMMM yyyy')}">12.12.2025</span>
        </p>
        <hr>
        <a th:href="@{/}" class="btn-back">← Back to Catalog</a>
    </aside>

    <main class="profile-content">
        <h1>My Collections</h1>

        <div class="collections-grid">
            <div class="collection-card" th:each="col : ${collections}">

                <div class="collection-header clickable-trigger" onclick="toggleCollection(this)">
                    <div class="title-wrapper">
                        <span class="arrow-icon">▶</span>
                        <h3 th:text="${col.name}" style="margin: 0; display: inline-block;">Reading</h3>
                    </div>
                    <span class="badge" th:text="${col.totalBooks} + ' books'">0 books</span>
                </div>

                <ul class="books-list hidden-list">
                    <li th:each="title, iter : ${col.bookTitles}">
                        <a th:href="@{/book/{id}(id=${col.bookIds[iter.index]})}" th:text="${title}">
                            Book Title
                        </a>
                    </li>

                    <li class="empty-list" th:if="${col.bookTitles == null or col.bookTitles.empty}">
                        No books in this collection yet.
                    </li>
                </ul>
            </div>
        </div>
    </main>
</div>

</body>
<script>
    function toggleCollection(headerElement) {

        headerElement.classList.toggle('active');
        const booksList = headerElement.nextElementSibling;

        if (booksList.style.display === "block") {
            booksList.style.display = "none";
        } else {
            booksList.style.display = "block";
        }
    }
</script>
</html>
