spring.application.name=BookNest_2
spring.datasource.url=${BOOKNEST_DB_URL:jdbc:postgresql://localhost:5432/booknest_db}
spring.datasource.username=${BOOKNEST_DB_USERNAME:user}
spring.datasource.password=${BOOKNEST_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.mail.host=${BOOKNEST_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${BOOKNEST_MAIL_PORT:587}
spring.mail.username=${BOOKNEST_MAIL_USERNAME:}
spring.mail.password=${BOOKNEST_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

booknest.mail.from=${BOOKNEST_MAIL_FROM:${BOOKNEST_MAIL_USERNAME:}}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
